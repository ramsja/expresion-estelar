<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Moderar testimonios · Expresión Estelar</title>
  <style>
    :root {
      --bg: #0d0b1f;
      --panel: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.14);
      --text: #efeaff;
      --muted: #a99fce;
      --accent: #c9a86a;
      --danger: #e0607a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: radial-gradient(1200px 800px at 70% -10%, #241a4d 0%, var(--bg) 60%);
      color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 2rem 1rem;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-weight: 600; letter-spacing: .02em; }
    .sub { color: var(--muted); margin-top: -.4rem; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.25rem 1.4rem; backdrop-filter: blur(8px); margin-bottom: 1rem;
    }
    label { display:block; font-size:.85rem; color: var(--muted); margin-bottom:.3rem; }
    input {
      width:100%; padding:.7rem .8rem; border-radius:10px; border:1px solid var(--border);
      background: rgba(0,0,0,.25); color: var(--text); font-size:1rem; margin-bottom:.9rem;
    }
    button {
      cursor:pointer; border:none; border-radius:10px; padding:.7rem 1.1rem; font-size:.95rem; font-weight:600;
    }
    .btn-primary { background: var(--accent); color:#241a1a; width:100%; }
    .btn-ghost { background: transparent; color: var(--muted); border:1px solid var(--border); }
    .btn-danger { background: transparent; color: var(--danger); border:1px solid rgba(224,96,122,.45); padding:.5rem .8rem; font-size:.85rem; }
    .btn-danger:hover { background: rgba(224,96,122,.12); }
    .row { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
    .rating { color: var(--accent); letter-spacing:2px; }
    .t-text { margin:.5rem 0; line-height:1.5; }
    .t-meta { color: var(--muted); font-size:.85rem; }
    .msg { padding:.8rem 1rem; border-radius:10px; margin:.5rem 0; font-size:.9rem; }
    .msg-error { background: rgba(224,96,122,.14); color:#ffb3c2; border:1px solid rgba(224,96,122,.4); }
    .msg-ok { background: rgba(120,220,150,.12); color:#bff5cf; border:1px solid rgba(120,220,150,.35); }
    .muted { color: var(--muted); }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:1rem; flex-wrap:wrap; }
    .hidden { display:none; }
    a.back { color: var(--muted); text-decoration:none; font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Moderar testimonios</h1>
    <p class="sub">Panel privado de Expresión Estelar</p>

    <!-- Vista de acceso -->
    <section id="login-view" class="card">
      <p class="muted">Ingresa con tu correo y contraseña de administradora para ver y borrar testimonios.</p>
      <form id="login-form">
        <label for="email">Correo</label>
        <input type="email" id="email" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="submit" class="btn-primary" id="login-btn">Entrar</button>
      </form>
      <div id="login-msg"></div>
    </section>

    <!-- Vista de lista -->
    <section id="list-view" class="hidden">
      <div class="top">
        <span class="muted" id="who"></span>
        <div>
          <a class="back" href="index.html">← Volver al sitio</a>
          &nbsp;&nbsp;
          <button class="btn-ghost" id="logout">Cerrar sesión</button>
        </div>
      </div>
      <div id="list-msg"></div>
      <div id="list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Estas credenciales son PÚBLICAS por diseño (clave anon). El borrado
    // está protegido por el login: sólo un usuario autenticado puede borrar
    // (regla de seguridad RLS en la base de datos).
    const SUPABASE_URL = 'https://dxjzcgqkehdhasofbmgy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4anpjZ3FrZWhkaGFzb2ZibWd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NTU2NzUsImV4cCI6MjEwMTQzMTY3NX0.12R9TNy04U5ihFZp5B5cYVrPKIfqt3duCvjwfzJrE44';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);
    const loginView = $('login-view');
    const listView = $('list-view');

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function showMsg(el, text, kind) {
      el.innerHTML = text ? `<div class="msg msg-${kind}">${escapeHtml(text)}</div>` : '';
    }

    async function enterApp(session) {
      loginView.classList.add('hidden');
      listView.classList.remove('hidden');
      $('who').textContent = 'Sesión: ' + (session.user?.email || 'administradora');
      await loadList();
    }

    async function loadList() {
      const list = $('list');
      showMsg($('list-msg'), '', 'ok');
      list.innerHTML = '<p class="muted">Cargando testimonios…</p>';
      const { data, error } = await client
        .from('testimonials')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        list.innerHTML = '';
        showMsg($('list-msg'), 'No se pudo cargar la lista: ' + error.message, 'error');
        return;
      }
      if (!data || data.length === 0) {
        list.innerHTML = '<p class="muted">No hay testimonios todavía.</p>';
        return;
      }
      list.innerHTML = data.map(t => {
        const stars = '★'.repeat(t.rating || 0) + '☆'.repeat(Math.max(0, 5 - (t.rating || 0)));
        const date = t.created_at ? new Date(t.created_at).toLocaleDateString('es-ES',
          { day:'numeric', month:'long', year:'numeric' }) : '';
        return `
          <div class="card">
            <div class="row">
              <span class="rating">${stars}</span>
              <button class="btn-danger" data-id="${t.id}">🗑️ Borrar</button>
            </div>
            <p class="t-text">"${escapeHtml(t.message)}"</p>
            <p class="t-meta">${escapeHtml(t.name)}${t.country ? ' · ' + escapeHtml(t.country) : ''} · ${escapeHtml(date)}</p>
          </div>`;
      }).join('');

      list.querySelectorAll('.btn-danger').forEach(btn => {
        btn.addEventListener('click', () => deleteOne(btn.dataset.id, btn));
      });
    }

    async function deleteOne(id, btn) {
      if (!confirm('¿Borrar este testimonio? Esta acción no se puede deshacer.')) return;
      btn.disabled = true;
      btn.textContent = 'Borrando…';
      const { error } = await client.from('testimonials').delete().eq('id', id);
      if (error) {
        btn.disabled = false;
        btn.textContent = '🗑️ Borrar';
        showMsg($('list-msg'), 'No se pudo borrar: ' + error.message, 'error');
        return;
      }
      showMsg($('list-msg'), 'Testimonio borrado.', 'ok');
      await loadList();
    }

    // Login
    $('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('login-btn');
      btn.disabled = true; btn.textContent = 'Entrando…';
      showMsg($('login-msg'), '', 'error');
      const { data, error } = await client.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value
      });
      btn.disabled = false; btn.textContent = 'Entrar';
      if (error) {
        showMsg($('login-msg'), 'No se pudo entrar: ' + error.message, 'error');
        return;
      }
      await enterApp(data.session);
    });

    // Logout
    $('logout').addEventListener('click', async () => {
      await client.auth.signOut();
      location.reload();
    });

    // Si ya hay sesión activa, entrar directo
    client.auth.getSession().then(({ data }) => {
      if (data.session) enterApp(data.session);
    });
  </script>
</body>
</html>
